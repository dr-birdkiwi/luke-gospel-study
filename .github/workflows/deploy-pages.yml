name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code
        run: npm run lint

      - name: Build static site
        run: npm run build:pages

      - name: Assemble Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp dist/server/prerendered-routes/index.html _site/index.html
          cp dist/server/prerendered-routes/404.html _site/404.html
          for route in dist/server/prerendered-routes/chapter/*.html; do
            chapter_name="$(basename "$route" .html)"
            mkdir -p "_site/chapter/${chapter_name}"
            cp "$route" "_site/chapter/${chapter_name}/index.html"
          done
          cp -R dist/client/_next _site/_next
          cp -R public/. _site/
          pages_base_path="/${GITHUB_REPOSITORY#*/}"
          find _site -name '*.html' -print0 | xargs -0 sed -i "s#href=\"/_next/#href=\"${pages_base_path}/_next/#g; s#src=\"/_next/#src=\"${pages_base_path}/_next/#g"
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
